services:
  db:
    image: postgres:16-alpine
    container_name: cloudcodevault_db
    environment:
      POSTGRES_DB: cloudcodevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cloudcodevault_app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cloudcodevault
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads: